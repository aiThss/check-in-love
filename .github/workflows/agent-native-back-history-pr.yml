name: Run native back fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/native-back-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-back-history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and run source patch
        shell: bash
        run: |
          awk '
            /node <<'"'"'NODE'"'"'/ { capture=1; next }
            capture && /^          NODE$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-native-back-history.yml > /tmp/apply-native-back-history.cjs
          node /tmp/apply-native-back-history.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/pwa/src/router.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = "      if (layer?.id === previousState.layerId) layer.close('back');";
          const after = "      if (layer && layer.id === previousState.layerId) layer.close('back');";
          if (!source.includes(before)) throw new Error('Missing nullable layer fix target');
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build shared package and PWA
        id: build
        continue-on-error: true
        shell: bash
        run: |
          {
            npm run build --workspace=packages/shared
            npm run build --workspace=apps/pwa
          } 2>&1 | tee /tmp/pwa-build.log

      - name: Report build diagnostics
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Build diagnostics from the native-back workflow:'
            echo
            echo '```text'
            tail -n 100 /tmp/pwa-build.log
            echo '```'
          } > /tmp/build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/build-comment.md
          exit 1

      - name: Test router history
        run: npm test -- apps/pwa/src/router.test.ts

      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-native-back-history.yml \
                 .github/workflows/agent-native-back-history-pr.yml
          git add apps/pwa/src/pages/home.ts \
                  apps/pwa/src/pages/memories.ts \
                  apps/pwa/src/router.ts \
                  apps/pwa/src/router.test.ts \
                  apps/pwa/src/components/modal.ts
          git commit -m "fix(pwa): preserve native-style back history"
          git push origin HEAD:agent/native-back-history
