name: Apply Android predictive back fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/android-predictive-back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/android-predictive-back

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch native back handling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Missing patch target: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Patch target is not unique: ${label}`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const activityPath = 'apps/android/app/src/main/java/com/example/lovecheck/MainActivity.kt';
          let activity = fs.readFileSync(activityPath, 'utf8');

          activity = replaceOnce(
            activity,
            'import androidx.activity.ComponentActivity\n',
            'import androidx.activity.ComponentActivity\nimport androidx.activity.OnBackPressedCallback\n',
            'OnBackPressedCallback import',
          );

          activity = replaceOnce(
            activity,
            `        }\n\n        checkUpdate()\n    }\n\n    override fun onNewIntent(intent: Intent) {`,
            `        }\n\n        installBackHandler()\n        checkUpdate()\n    }\n\n    private fun installBackHandler() {\n        onBackPressedDispatcher.addCallback(\n            this,\n            object : OnBackPressedCallback(true) {\n                override fun handleOnBackPressed() {\n                    val currentWebView = webView ?: return\n\n                    // Route every system/predictive Back gesture through the web history.\n                    // This lets the PWA close its active modal/history layer or restore\n                    // the previous tab. At the app root history.back() is a no-op, so\n                    // MainActivity stays open instead of being finished by Android.\n                    currentWebView.evaluateJavascript(\n                        \"window.history.back();\",\n                        null,\n                    )\n                }\n            },\n        )\n    }\n\n    override fun onNewIntent(intent: Intent) {`,
            'install back handler',
          );

          activity = replaceOnce(
            activity,
            `    @Deprecated(\"Deprecated in Java\")\n    override fun onBackPressed() {\n        if (webView?.canGoBack() == true) {\n            webView?.goBack()\n        } else {\n            super.onBackPressed()\n        }\n    }\n\n`,
            '',
            'legacy onBackPressed override',
          );

          fs.writeFileSync(activityPath, activity);

          const gradlePath = 'apps/android/app/build.gradle.kts';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          gradle = replaceOnce(gradle, '        versionCode = 21\n        versionName = \"1.1.11\"', '        versionCode = 22\n        versionName = \"1.1.12\"', 'Android version bump');
          fs.writeFileSync(gradlePath, gradle);
          NODE

      - name: Verify source patch
        shell: bash
        run: |
          grep -q 'OnBackPressedCallback' apps/android/app/src/main/java/com/example/lovecheck/MainActivity.kt
          grep -q 'window.history.back();' apps/android/app/src/main/java/com/example/lovecheck/MainActivity.kt
          ! grep -q 'override fun onBackPressed()' apps/android/app/src/main/java/com/example/lovecheck/MainActivity.kt
          grep -q 'versionCode = 22' apps/android/app/build.gradle.kts

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x apps/android/gradlew
          cd apps/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Publish source and APK to branch
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cp apps/android/app/build/outputs/apk/release/app-release.apk app-release.apk
            ls -lh app-release.apk
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/agent-android-predictive-back.yml
            git add apps/android/app/src/main/java/com/example/lovecheck/MainActivity.kt \
                    apps/android/app/build.gradle.kts \
                    app-release.apk
            git status --short
            git commit -m "fix(android): handle predictive back through web history"
            git push origin HEAD:agent/android-predictive-back
          } 2>&1 | tee /tmp/android-publish.log

      - name: Report publish diagnostics
        if: steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Android publish diagnostics:'
            echo
            echo '```text'
            tail -n 120 /tmp/android-publish.log
            echo '```'
          } > /tmp/android-publish-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/android-publish-comment.md
          exit 1
