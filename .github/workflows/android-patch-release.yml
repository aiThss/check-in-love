name: Android patch release

on:
  push:
    branches:
      - main
    paths:
      - "apps/android/app/src/**"
      - "apps/android/app/build.gradle.kts"
      - ".github/workflows/android-patch-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-patch-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read patch version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(grep -E 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' | head -n 1)"
          VERSION_CODE="$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/' | head -n 1)"

          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read Android version" >&2
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate patch publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release APK
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "app-release.apk"
          sha256sum "app-release.apk"

      - name: Publish GitHub patch release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "app-release.apk#app-release.apk" \
            --target "$GITHUB_SHA" \
            --title "LoveCheck v$VERSION_NAME" \
            --notes "Android patch v$VERSION_NAME (versionCode $VERSION_CODE). Adds native keyboard sticker input, preserves transparent sticker media, and keeps the in-app update prompt in sequence."
