name: Apply native back history fix

on:
  push:
    branches:
      - agent/native-back-history

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/native-back-history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content);
          }

          function replaceOnce(content, from, to, label) {
            const index = content.indexOf(from);
            if (index < 0) throw new Error(`Missing replacement target: ${label}`);
            if (content.indexOf(from, index + from.length) >= 0) {
              throw new Error(`Replacement target is not unique: ${label}`);
            }
            return content.slice(0, index) + to + content.slice(index + from.length);
          }

          // Home polaroid: 5s -> 3s.
          {
            const path = 'apps/pwa/src/pages/home.ts';
            let content = read(path);
            content = replaceOnce(
              content,
              '  setTimeout(() => loadCheckin(), 5000);',
              '  setTimeout(() => loadCheckin(), 3000);',
              'home polaroid delay',
            );
            write(path, content);
          }

          // Memories polaroid: fixed 2s, including slow connections.
          {
            const path = 'apps/pwa/src/pages/memories.ts';
            let content = read(path);
            content = replaceOnce(
              content,
              `    // Polaroid skeleton — every initial visit, min 3s (5s if network is slow)\n    let minWaitPromise: Promise<void> = Promise.resolve();\n    if (page === 1 && !append) {\n      skeletonActive = true;\n      grid.style.display = 'grid';\n      grid.innerHTML = renderMemoriesPolaroidSkeleton();\n\n      const conn = (navigator as any).connection;\n      const isSlowNetwork = conn?.effectiveType === '2g' || conn?.effectiveType === 'slow-2g';\n      const minWaitMs = isSlowNetwork ? 5000 : 3000;\n      minWaitPromise = new Promise<void>(resolve => setTimeout(resolve, minWaitMs));\n    }`,
              `    // Polaroid skeleton — every initial visit, fixed 2s.\n    let minWaitPromise: Promise<void> = Promise.resolve();\n    if (page === 1 && !append) {\n      skeletonActive = true;\n      grid.style.display = 'grid';\n      grid.innerHTML = renderMemoriesPolaroidSkeleton();\n      minWaitPromise = new Promise<void>((resolve) => setTimeout(resolve, 2000));\n    }`,
              'memories polaroid delay',
            );
            write(path, content);
          }

          // Router: add native-style route/layer history and an in-app boundary.
          {
            const path = 'apps/pwa/src/router.ts';
            let content = read(path);

            content = replaceOnce(
              content,
              `const AUTO_REVALIDATE_ROUTES = new Set(['/app/home', '/app/memories']);\nconst AUTO_REVALIDATE_AFTER_MS = 15_000;`,
              `const AUTO_REVALIDATE_ROUTES = new Set(['/app/home', '/app/memories']);\nconst AUTO_REVALIDATE_AFTER_MS = 15_000;\nconst APP_HISTORY_STATE_KEY = '__checkInLoveAppHistory';\n\ntype AppHistoryKind = 'boundary' | 'route' | 'layer';\nexport type HistoryLayerCloseReason = 'back' | 'replace' | 'navigation';\n\ninterface AppHistoryState {\n  app: true;\n  kind: AppHistoryKind;\n  path: string;\n  layerId?: string;\n}\n\ninterface HistoryLayer {\n  id: string;\n  close: (reason: HistoryLayerCloseReason) => void;\n}`,
              'router history types',
            );

            content = replaceOnce(
              content,
              `const pageCache = new Map<string, CachedPage>();`,
              `const pageCache = new Map<string, CachedPage>();\nlet currentHistoryState: AppHistoryState | null = null;\nlet activeHistoryLayer: HistoryLayer | null = null;\nlet appBoundarySeeded = false;\nlet historyLayerSequence = 0;`,
              'router history state',
            );

            const historyHelpers = `\nfunction readAppHistoryState(value: unknown = history.state): AppHistoryState | null {\n  if (!value || typeof value !== 'object') return null;\n  const wrapped = (value as Record<string, unknown>)[APP_HISTORY_STATE_KEY];\n  if (!wrapped || typeof wrapped !== 'object') return null;\n\n  const candidate = wrapped as Partial<AppHistoryState>;\n  if (candidate.app !== true || typeof candidate.path !== 'string') return null;\n  if (candidate.kind !== 'boundary' && candidate.kind !== 'route' && candidate.kind !== 'layer') return null;\n  if (candidate.kind === 'layer' && typeof candidate.layerId !== 'string') return null;\n  return candidate as AppHistoryState;\n}\n\nfunction withoutAppHistoryState(value: unknown = history.state): Record<string, unknown> {\n  if (!value || typeof value !== 'object') return {};\n  const next = { ...(value as Record<string, unknown>) };\n  delete next[APP_HISTORY_STATE_KEY];\n  return next;\n}\n\nfunction createAppHistoryState(kind: AppHistoryKind, path: string, layerId?: string): AppHistoryState {\n  return { app: true, kind, path, ...(layerId ? { layerId } : {}) };\n}\n\nfunction writeAppHistoryState(\n  method: 'push' | 'replace',\n  state: AppHistoryState,\n  url = state.path,\n): void {\n  const next = withoutAppHistoryState();\n  next[APP_HISTORY_STATE_KEY] = state;\n  if (method === 'replace') history.replaceState(next, '', url);\n  else history.pushState(next, '', url);\n  currentHistoryState = state;\n}\n\nfunction writeRouteHistory(path: string, replace: boolean): void {\n  const target = new URL(path, window.location.origin);\n  const nextPath = target.pathname + target.search;\n  const state = withoutAppHistoryState();\n  const appRoute = target.pathname.startsWith('/app/');\n  const appState = appRoute && appBoundarySeeded\n    ? createAppHistoryState('route', nextPath)\n    : null;\n\n  if (appState) state[APP_HISTORY_STATE_KEY] = appState;\n  if (replace) history.replaceState(state, '', nextPath);\n  else history.pushState(state, '', nextPath);\n  currentHistoryState = appState;\n}\n\nfunction ensureAppHistoryBoundary(path: string): void {\n  const target = new URL(path, window.location.origin);\n  if (!store.isAuthenticated() || !target.pathname.startsWith('/app/')) return;\n\n  const nextPath = target.pathname + target.search;\n  if (appBoundarySeeded) {\n    const existing = readAppHistoryState();\n    if (!existing || existing.kind === 'boundary') {\n      writeAppHistoryState('replace', createAppHistoryState('route', nextPath), nextPath);\n    } else {\n      currentHistoryState = existing;\n    }\n    return;\n  }\n\n  appBoundarySeeded = true;\n  writeAppHistoryState('replace', createAppHistoryState('boundary', nextPath), nextPath);\n  writeAppHistoryState('push', createAppHistoryState('route', nextPath), nextPath);\n}\n\nfunction closeActiveHistoryLayerForNavigation(): void {\n  const layer = activeHistoryLayer;\n  if (!layer) return;\n  activeHistoryLayer = null;\n  layer.close('navigation');\n  writeRouteHistory(getCurrentPath(), true);\n}\n\nexport function openHistoryLayer(close: (reason: HistoryLayerCloseReason) => void): string {\n  const path = getCurrentPath();\n  ensureAppHistoryBoundary(path);\n  const id = 'layer-' + Date.now() + '-' + (++historyLayerSequence);\n\n  if (activeHistoryLayer) {\n    const previous = activeHistoryLayer;\n    activeHistoryLayer = null;\n    previous.close('replace');\n    writeAppHistoryState('replace', createAppHistoryState('layer', path, id), path);\n  } else {\n    writeAppHistoryState('push', createAppHistoryState('layer', path, id), path);\n  }\n\n  activeHistoryLayer = { id, close };\n  return id;\n}\n\nexport function closeHistoryLayer(id: string): void {\n  if (activeHistoryLayer?.id !== id) return;\n  activeHistoryLayer = null;\n  const state = readAppHistoryState();\n  if (state?.kind === 'layer' && state.layerId === id) history.back();\n}\n`;

            content = replaceOnce(
              content,
              `export function getCurrentPath(): string {\n  return \`${'${window.location.pathname}${window.location.search}'}\`;\n}\n`,
              `export function getCurrentPath(): string {\n  return \`${'${window.location.pathname}${window.location.search}'}\`;\n}\n${historyHelpers}`,
              'router history helpers',
            );

            content = replaceOnce(
              content,
              `export function navigate(path: string, replace = false): void {\n  const target = new URL(path, window.location.origin);\n  const nextPath = \`${'${target.pathname}${target.search}'}\`;\n\n  if (nextPath === getCurrentPath()) {\n    void renderRoute(target.pathname);\n    return;\n  }\n\n  if (replace) {\n    history.replaceState({}, '', nextPath);\n  } else {\n    history.pushState({}, '', nextPath);\n  }\n  void renderRoute(target.pathname);\n}`,
              `export function navigate(path: string, replace = false): void {\n  const target = new URL(path, window.location.origin);\n  const nextPath = \`${'${target.pathname}${target.search}'}\`;\n\n  closeActiveHistoryLayerForNavigation();\n\n  if (nextPath === getCurrentPath()) {\n    void renderRoute(target.pathname);\n    return;\n  }\n\n  writeRouteHistory(nextPath, replace);\n  void renderRoute(target.pathname);\n}`,
              'router navigate',
            );

            content = replaceOnce(
              content,
              `  ensureShell();\n\n  window.addEventListener('popstate', () => {\n    void renderRoute(window.location.pathname);\n  });`,
              `  ensureShell();\n  currentHistoryState = readAppHistoryState();\n  ensureAppHistoryBoundary(getCurrentPath());\n\n  window.addEventListener('popstate', (event) => {\n    const previousState = currentHistoryState;\n    let nextState = readAppHistoryState(event.state);\n    currentHistoryState = nextState;\n\n    if (previousState?.kind === 'layer') {\n      const layer = activeHistoryLayer;\n      activeHistoryLayer = null;\n      if (layer?.id === previousState.layerId) layer.close('back');\n    }\n\n    if (nextState?.kind === 'layer' && activeHistoryLayer?.id !== nextState.layerId) {\n      writeRouteHistory(getCurrentPath(), true);\n      nextState = currentHistoryState;\n    }\n\n    if (\n      nextState?.kind === 'boundary'\n      && store.isAuthenticated()\n      && window.location.pathname.startsWith('/app/')\n    ) {\n      const fallbackPath = previousState?.path?.startsWith('/app/')\n        ? previousState.path\n        : '/app/home';\n      const fallback = new URL(fallbackPath, window.location.origin);\n      const normalized = fallback.pathname + fallback.search;\n      writeAppHistoryState('replace', createAppHistoryState('boundary', normalized), normalized);\n      writeAppHistoryState('push', createAppHistoryState('route', normalized), normalized);\n      void renderRoute(fallback.pathname);\n      return;\n    }\n\n    void renderRoute(window.location.pathname);\n  });`,
              'router popstate',
            );

            content = replaceOnce(
              content,
              `  const resolvedPath = resolveRoute(path);\n  const factory = routes[resolvedPath];`,
              `  const resolvedPath = resolveRoute(path);\n  if (resolvedPath.startsWith('/app/')) ensureAppHistoryBoundary(getCurrentPath());\n  const factory = routes[resolvedPath];`,
              'router boundary render hook',
            );

            write(path, content);
          }

          // Shared modal: every modal/detail view becomes a back-dismissable history layer.
          {
            const path = 'apps/pwa/src/components/modal.ts';
            let content = read(path);

            content = `import { closeHistoryLayer, openHistoryLayer } from '../router';\n\n` + content;
            content = replaceOnce(
              content,
              `let activeOverlay: HTMLElement | null = null;`,
              `let activeOverlay: HTMLElement | null = null;\nlet activeHistoryLayerId: string | null = null;\nlet activeEscHandler: ((event: KeyboardEvent) => void) | null = null;\n\nfunction removeOverlay(overlay: HTMLElement, escHandler: (event: KeyboardEvent) => void): void {\n  document.removeEventListener('keydown', escHandler);\n  overlay.remove();\n\n  if (activeOverlay === overlay) {\n    activeOverlay = null;\n    activeHistoryLayerId = null;\n    activeEscHandler = null;\n  }\n  if (!activeOverlay) document.body.style.overflow = '';\n}`,
              'modal active state',
            );
            content = replaceOnce(
              content,
              `export function showModal(options: ModalOptions): void {\n  // Remove any existing modal\n  closeModal();\n`,
              `export function showModal(options: ModalOptions): void {\n`,
              'modal replacement behavior',
            );
            content = replaceOnce(
              content,
              `  document.addEventListener('keydown', escHandler);\n\n  (document.getElementById('modal-root') ?? document.body).appendChild(overlay);\n  activeOverlay = overlay;\n\n  // Prevent body scroll\n  document.body.style.overflow = 'hidden';`,
              `  document.addEventListener('keydown', escHandler);\n\n  const historyLayerId = openHistoryLayer((reason) => {\n    if (reason === 'back') options.onCancel?.();\n    removeOverlay(overlay, escHandler);\n  });\n\n  (document.getElementById('modal-root') ?? document.body).appendChild(overlay);\n  activeOverlay = overlay;\n  activeHistoryLayerId = historyLayerId;\n  activeEscHandler = escHandler;\n\n  // Prevent body scroll\n  document.body.style.overflow = 'hidden';`,
              'modal history layer',
            );
            content = replaceOnce(
              content,
              `export function closeModal(): void {\n  if (activeOverlay) {\n    activeOverlay.remove();\n    activeOverlay = null;\n    document.body.style.overflow = '';\n  }\n}`,
              `export function closeModal(): void {\n  const overlay = activeOverlay;\n  const historyLayerId = activeHistoryLayerId;\n  const escHandler = activeEscHandler;\n  if (!overlay || !escHandler) return;\n\n  removeOverlay(overlay, escHandler);\n  if (historyLayerId) closeHistoryLayer(historyLayerId);\n}`,
              'modal close',
            );
            write(path, content);
          }

          // Router regression test for back-dismissable UI layers.
          {
            const path = 'apps/pwa/src/router.test.ts';
            let content = read(path);
            const anchor = `  it('redirects protected routes after authentication is cleared and destroys cached pages', async () => {`;
            const test = `  it('dismisses a UI layer before navigating away from the current tab', async () => {\n    router.navigate('/app/home');\n    await flush();\n    const onClose = vi.fn();\n\n    router.openHistoryLayer(onClose);\n    expect((history.state as any).__checkInLoveAppHistory?.kind).toBe('layer');\n\n    history.back();\n    await new Promise((resolve) => setTimeout(resolve, 25));\n\n    expect(onClose).toHaveBeenCalledOnce();\n    expect(onClose).toHaveBeenCalledWith('back');\n    expect(window.location.pathname).toBe('/app/home');\n    expectOnlyVisibleRoute('/app/home');\n  });\n\n`;
            content = replaceOnce(content, anchor, test + anchor, 'router layer test');
            write(path, content);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build --workspace=apps/pwa

      - name: Test router history
        run: npm test -- apps/pwa/src/router.test.ts

      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-native-back-history.yml
          git add apps/pwa/src/pages/home.ts \
                  apps/pwa/src/pages/memories.ts \
                  apps/pwa/src/router.ts \
                  apps/pwa/src/router.test.ts \
                  apps/pwa/src/components/modal.ts
          git commit -m "fix(pwa): preserve native-style back history"
          git push origin HEAD:agent/native-back-history
