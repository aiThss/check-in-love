name = "check-in-love-api"
account_id = "8ccdd0f39d9060b1de9fdb6132acbcb7"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "couple-db"
database_id = "265081d5-bbc7-48a9-9dca-81b83b49a1f4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "check-in-love-storage"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[triggers]
crons = ["* * * * *"]

