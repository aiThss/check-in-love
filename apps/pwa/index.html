<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Check IN Love" />
    <meta name="theme-color" content="#FF3B7F" />
    <meta name="application-name" content="Check IN Love" />

    <!-- Open Graph -->
    <meta property="og:title" content="Check IN Love 💕" />
    <meta property="og:description" content="App check-in riêng tư cho hai đứa" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Check IN Love 💕" />
    <meta name="twitter:description" content="App check-in riêng tư cho hai đứa" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png" />

    <!-- Pre-paint theme initialization to avoid FOUC -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lovecheck_state_v1');
          var theme = raw ? JSON.parse(raw).theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#14081d' : '#fff5f8');
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <title>Check IN Love 💕</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/daily-first-photo-scratch.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
