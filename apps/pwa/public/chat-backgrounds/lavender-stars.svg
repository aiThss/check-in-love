    <path d="M310 344 433 438 546 306" stroke-width="2" opacity=".45"/>
  </g>
  <g fill="#fff">
    <circle cx="196" cy="490" r="8"/><circle cx="310" cy="344" r="6"/>
    <circle cx="433" cy="438" r="8"/><circle cx="546" cy="306" r="6"/><circle cx="690" cy="402" r="8"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".74">
    <path d="M132 820v52m-26-26h52" stroke-width="6"/>
    <path d="M750 620v62m-31-31h62" stroke-width="5"/>
    <path d="M650 1250v48m-24-24h48" stroke-width="4"/>
  </g>
  <g fill="#fff" opacity=".7">
    <circle cx="270" cy="980" r="4"/><circle cx="380" cy="1140" r="6"/>
    <circle cx="570" cy="890" r="4"/><circle cx="820" cy="970" r="5"/>
    <circle cx="88" cy="1220" r="4"/>
