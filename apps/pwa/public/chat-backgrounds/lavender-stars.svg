<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sao tím</title>
  <desc id="desc">Nền tím xanh dịu với sao nhỏ và một chòm sao hình trái tim.</desc>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop stop-color="#dcd2ff"/>
      <stop offset=".52" stop-color="#b8cdfb"/>
      <stop offset="1" stop-color="#7d88cf"/>
    </linearGradient>
    <radialGradient id="haze" cx=".75" cy=".28" r=".7">
      <stop stop-color="#fff" stop-opacity=".52"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <rect width="900" height="1600" fill="url(#haze)"/>
  <g fill="#fff" opacity=".24" filter="url(#soft)">
